$toml = @"
[package]
name = "veil-blockchain"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
urlencoding = "2.1"
"@
Set-Content -Path "Cargo.toml" -Value $toml -Encoding utf8