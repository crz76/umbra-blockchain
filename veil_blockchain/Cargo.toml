[package]
name = "veil_blockchain"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core", "pem"] }
urlencoding = "2.1"
hex = "0.4"